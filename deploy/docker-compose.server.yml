services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: edunurse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edunurse}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/prisma/sql/enable_extensions.sql:/docker-entrypoint-initdb.d/01_enable_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-edunurse}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runner
    container_name: edunurse-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-edunurse}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.example.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EXPORT_STORAGE_DIR: /app/storage/exports
      EXPORT_WORKER_POLL_MS: ${EXPORT_WORKER_POLL_MS:-2000}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-86400}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-https://app.example.com}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@example.com}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@example.com}
      WHATSAPP_GROUP_LINK: ${WHATSAPP_GROUP_LINK:-}
      LLM_PROVIDER_PRIORITY: ${LLM_PROVIDER_PRIORITY:-azure,gemini,deepseek}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
      AZURE_OPENAI_EMBEDDING_API_VERSION: ${AZURE_OPENAI_EMBEDDING_API_VERSION:-2024-10-21}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-text-embedding-004}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1/chat/completions}
      INGESTION_EMBEDDINGS_ENABLED: ${INGESTION_EMBEDDINGS_ENABLED:-true}
      EMBEDDING_PROVIDER_PRIORITY: ${EMBEDDING_PROVIDER_PRIORITY:-azure,gemini,local}
      EMBEDDING_VECTOR_DIM: ${EMBEDDING_VECTOR_DIM:-1536}
      LENCO_API_KEY: ${LENCO_API_KEY:-}
      LENCO_API_BASE_URL: ${LENCO_API_BASE_URL:-https://api.lenco.co/access/v2}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-https://app.example.com}
      PRESENTATION_ENABLE_AI_IMAGES: ${PRESENTATION_ENABLE_AI_IMAGES:-false}
      PRESENTATION_AI_IMAGE_PROVIDER: ${PRESENTATION_AI_IMAGE_PROVIDER:-openai}
      OPENAI_IMAGES_API_KEY: ${OPENAI_IMAGES_API_KEY:-}
      OPENAI_IMAGES_MODEL: ${OPENAI_IMAGES_MODEL:-gpt-image-1}
      AZURE_DALLE_ENDPOINT: ${AZURE_DALLE_ENDPOINT:-}
      AZURE_DALLE_API_KEY: ${AZURE_DALLE_API_KEY:-}
      AZURE_DALLE_MODEL: ${AZURE_DALLE_MODEL:-dall-e-3}
      AZURE_DALLE_STYLE: ${AZURE_DALLE_STYLE:-vivid}
      AZURE_DALLE_QUALITY: ${AZURE_DALLE_QUALITY:-standard}
    volumes:
      - export_data:/app/storage/exports
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: worker
    container_name: edunurse-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-edunurse}?schema=public
      EXPORT_STORAGE_DIR: /app/storage/exports
      EXPORT_WORKER_POLL_MS: ${EXPORT_WORKER_POLL_MS:-2000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HOST: 0.0.0.0
      PORT: 4000
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-86400}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      LLM_PROVIDER_PRIORITY: ${LLM_PROVIDER_PRIORITY:-azure,gemini,deepseek}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1/chat/completions}
      INGESTION_EMBEDDINGS_ENABLED: ${INGESTION_EMBEDDINGS_ENABLED:-true}
      EMBEDDING_PROVIDER_PRIORITY: ${EMBEDDING_PROVIDER_PRIORITY:-azure,gemini,local}
      EMBEDDING_VECTOR_DIM: ${EMBEDDING_VECTOR_DIM:-1536}
      PRESENTATION_ENABLE_AI_IMAGES: ${PRESENTATION_ENABLE_AI_IMAGES:-false}
      PRESENTATION_AI_IMAGE_PROVIDER: ${PRESENTATION_AI_IMAGE_PROVIDER:-openai}
      OPENAI_IMAGES_API_KEY: ${OPENAI_IMAGES_API_KEY:-}
      OPENAI_IMAGES_MODEL: ${OPENAI_IMAGES_MODEL:-gpt-image-1}
      AZURE_DALLE_ENDPOINT: ${AZURE_DALLE_ENDPOINT:-}
      AZURE_DALLE_API_KEY: ${AZURE_DALLE_API_KEY:-}
      AZURE_DALLE_MODEL: ${AZURE_DALLE_MODEL:-dall-e-3}
      AZURE_DALLE_STYLE: ${AZURE_DALLE_STYLE:-vivid}
      AZURE_DALLE_QUALITY: ${AZURE_DALLE_QUALITY:-standard}
    volumes:
      - export_data:/app/storage/exports
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_GOOGLE_OAUTH_CLIENT_ID: ${VITE_GOOGLE_OAUTH_CLIENT_ID:-}
        VITE_GOOGLE_OAUTH_REDIRECT_URI: ${VITE_GOOGLE_OAUTH_REDIRECT_URI:-}
    container_name: edunurse-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"

  migrator:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: migrator
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-edunurse}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  export_data:
