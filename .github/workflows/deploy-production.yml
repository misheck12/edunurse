name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: false
        default: "main"

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_namespace: ${{ steps.meta.outputs.image_namespace }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Resolve build ref
        id: build_ref
        run: |
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            echo "value=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.build_ref.outputs.value }}

      - name: Prepare image metadata
        id: meta
        run: |
          IMAGE_NAMESPACE="$(echo "${GITHUB_REPOSITORY_OWNER}/edunurse" | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="sha-${GITHUB_SHA::12}"
          echo "image_namespace=$IMAGE_NAMESPACE" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend runner image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/backend:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/backend:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/backend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/backend:buildcache,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/worker:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/worker:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/worker:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/worker:buildcache,mode=max

      - name: Build and push migrator image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: migrator
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/migrator:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/migrator:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/migrator:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/migrator:buildcache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api/v1' }}
            VITE_GOOGLE_OAUTH_CLIENT_ID=${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID || '' }}
            VITE_GOOGLE_OAUTH_REDIRECT_URI=${{ vars.VITE_GOOGLE_OAUTH_REDIRECT_URI || '' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/frontend:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/frontend:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/frontend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/frontend:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Resolve deploy ref
        id: ref
        run: |
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            echo "value=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: /var/www/livingilabs/edunurse
          DEPLOY_REF: ${{ steps.ref.outputs.value }}
        with:
          host: ${{ secrets.SERVER_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH,DEPLOY_REF
          script_stop: true
          script: |
            set -e
            
            echo "=== Server-side Build Deployment ==="
            echo "Deploy Path: $DEPLOY_PATH"
            echo "Deploy Ref: $DEPLOY_REF"
            echo "Current user: $(whoami)"
            echo "Current directory: $(pwd)"
            echo "=================================="
            
            # Create deployment directory if it doesn't exist
            echo "Creating deployment directory: $DEPLOY_PATH"
            mkdir -p "$DEPLOY_PATH" 2>/dev/null || {
              echo "Trying with sudo..."
              sudo mkdir -p "$DEPLOY_PATH"
              sudo chown -R $(whoami):$(whoami) "$DEPLOY_PATH"
            }
            
            echo "Changing to deployment directory..."
            cd "$DEPLOY_PATH"
            
            echo "Current directory: $(pwd)"
            echo "Directory contents:"
            ls -la . 2>/dev/null || echo "Failed to list directory"
            
            # Check if this is a git repository
            if [ -d ".git" ]; then
              echo "Git repository detected"
              echo "Git status:"
              git status 2>/dev/null || echo "Git status failed"
              
              echo "Current branch:"
              git branch 2>/dev/null || echo "Git branch failed"
              
              echo "Git remotes:"
              git remote -v 2>/dev/null || echo "Git remote failed"
              
              # Simple git update
              echo "Updating repository..."
              git fetch origin 2>/dev/null || echo "Git fetch failed"
              git checkout main 2>/dev/null || echo "Git checkout failed"
              git pull origin main 2>/dev/null || echo "Git pull failed"
            else
              echo "No git repository found, cloning..."
              git clone https://github.com/misheck12/edunurse.git . 2>/dev/null || {
                echo "Git clone failed"
                exit 1
              }
            fi
            
            echo "Current commit: $(git rev-parse HEAD 2>/dev/null || echo 'Unknown')"
            
            # Check for required files
            echo "Checking for required files..."
            if [ -f "deploy/docker-compose.server.yml" ]; then
              echo "✓ docker-compose.server.yml found"
            else
              echo "✗ docker-compose.server.yml NOT found"
              echo "Files in deploy/:"
              ls -la deploy/ 2>/dev/null || echo "Deploy directory not accessible"
              exit 1
            fi
            
            if [ -f "deploy/.env.server.COMPLETE" ]; then
              echo "✓ .env.server.COMPLETE found"
              cp deploy/.env.server.COMPLETE deploy/.env.server
              echo "✓ Environment file copied"
            else
              echo "✗ .env.server.COMPLETE NOT found"
              exit 1
            fi
            
            echo "Repository setup completed successfully!"
            echo "Starting Docker operations..."
            
            # Use docker-compose (with hyphen) for older Docker versions
            compose() {
              if command -v docker-compose >/dev/null 2>&1; then
                docker-compose "$@"
              else
                docker compose "$@"
              fi
            }
            
            echo "Starting deployment with server-side build..."
            
            # Start postgres first
            compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server up -d postgres
            echo "Waiting for postgres to be ready..."
            sleep 30
            
            # Build all images on server
            echo "Building images on server..."
            export DOCKER_BUILDKIT=0
            export COMPOSE_DOCKER_CLI_BUILD=0
            compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server build backend worker frontend migrator
            
            # Run migrations
            echo "Running database migrations..."
            compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server --profile tools run --rm migrator
            
            # Start all services
            echo "Starting all services..."
            compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server up -d backend worker frontend
            
            # Show status
            echo "Deployment status:"
            compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server ps
            
            echo "Recent logs:"
            compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server logs --tail=50 backend worker || true
            
            echo "Deployment completed successfully!"
