name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: false
        default: "main"

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_namespace: ${{ steps.meta.outputs.image_namespace }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Resolve build ref
        id: build_ref
        run: |
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            echo "value=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.build_ref.outputs.value }}

      - name: Prepare image metadata
        id: meta
        run: |
          IMAGE_NAMESPACE="$(echo "${GITHUB_REPOSITORY_OWNER}/edunurse" | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="sha-${GITHUB_SHA::12}"
          echo "image_namespace=$IMAGE_NAMESPACE" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend runner image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/backend:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/backend:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/backend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/backend:buildcache,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/worker:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/worker:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/worker:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/worker:buildcache,mode=max

      - name: Build and push migrator image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: migrator
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/migrator:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/migrator:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/migrator:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/migrator:buildcache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api/v1' }}
            VITE_GOOGLE_OAUTH_CLIENT_ID=${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID || '' }}
            VITE_GOOGLE_OAUTH_REDIRECT_URI=${{ vars.VITE_GOOGLE_OAUTH_REDIRECT_URI || '' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/frontend:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/frontend:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/frontend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/frontend:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Resolve deploy ref
        id: ref
        run: |
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            echo "value=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: /var/www/livingilabs/edunurse
          DEPLOY_REF: ${{ steps.ref.outputs.value }}
          IMAGE_NAMESPACE: ${{ needs.build-and-push.outputs.image_namespace }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          # Database
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'edunurse' }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'edunurse' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Application
          NODE_ENV: production
          HOST: 0.0.0.0
          PORT: 4000
          APP_PORT: ${{ vars.APP_PORT || '80' }}
          # Auth
          AUTH_TOKEN_SECRET: ${{ secrets.AUTH_TOKEN_SECRET }}
          AUTH_TOKEN_TTL_SECONDS: ${{ vars.AUTH_TOKEN_TTL_SECONDS || '86400' }}
          SUPERADMIN_EMAIL: ${{ vars.SUPERADMIN_EMAIL }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
          # LLM
          LLM_PROVIDER_PRIORITY: ${{ vars.LLM_PROVIDER_PRIORITY || 'azure,gemini' }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          # Payment
          LENCO_API_KEY: ${{ secrets.LENCO_API_KEY }}
          LENCO_API_BASE_URL: ${{ vars.LENCO_API_BASE_URL }}
          # CORS
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          # Storage
          EXPORT_STORAGE_DIR: ${{ vars.EXPORT_STORAGE_DIR || '/app/storage/exports' }}
          EXPORT_WORKER_POLL_MS: ${{ vars.EXPORT_WORKER_POLL_MS || '2000' }}
          # Embeddings
          INGESTION_EMBEDDINGS_ENABLED: ${{ vars.INGESTION_EMBEDDINGS_ENABLED || 'true' }}
          EMBEDDING_PROVIDER_PRIORITY: ${{ vars.EMBEDDING_PROVIDER_PRIORITY || 'azure,gemini' }}
          # OAuth
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REDIRECT_URI: ${{ vars.GOOGLE_OAUTH_REDIRECT_URI }}
          # Email
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || 'true' }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          WHATSAPP_GROUP_LINK: ${{ vars.WHATSAPP_GROUP_LINK }}
          # AI Images
          PRESENTATION_ENABLE_AI_IMAGES: ${{ vars.PRESENTATION_ENABLE_AI_IMAGES || 'true' }}
          AZURE_DALLE_ENDPOINT: ${{ secrets.AZURE_DALLE_ENDPOINT }}
          AZURE_DALLE_API_KEY: ${{ secrets.AZURE_DALLE_API_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH,DEPLOY_REF,IMAGE_NAMESPACE,IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,DATABASE_URL,NODE_ENV,HOST,PORT,APP_PORT,AUTH_TOKEN_SECRET,AUTH_TOKEN_TTL_SECONDS,SUPERADMIN_EMAIL,SUPERADMIN_PASSWORD,LLM_PROVIDER_PRIORITY,AZURE_OPENAI_ENDPOINT,AZURE_OPENAI_API_KEY,AZURE_OPENAI_DEPLOYMENT,AZURE_OPENAI_API_VERSION,GEMINI_API_KEY,GEMINI_MODEL,LENCO_API_KEY,LENCO_API_BASE_URL,CORS_ORIGIN,FRONTEND_URL,EXPORT_STORAGE_DIR,EXPORT_WORKER_POLL_MS,INGESTION_EMBEDDINGS_ENABLED,EMBEDDING_PROVIDER_PRIORITY,GOOGLE_OAUTH_CLIENT_ID,GOOGLE_OAUTH_CLIENT_SECRET,GOOGLE_OAUTH_REDIRECT_URI,EMAIL_ENABLED,EMAIL_FROM,SUPPORT_EMAIL,WHATSAPP_GROUP_LINK,PRESENTATION_ENABLE_AI_IMAGES,AZURE_DALLE_ENDPOINT,AZURE_DALLE_API_KEY
          script_stop: true
          script: |
            set -euo pipefail

            # Create deployment directory if it doesn't exist
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            # Login to GitHub Container Registry
            if [ -n "${GHCR_USERNAME:-}" ] && [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            else
              echo "ERROR: GHCR credentials are required for stateless deployment"
              exit 1
            fi

            # Set image variables
            export BACKEND_IMAGE="ghcr.io/${IMAGE_NAMESPACE}/backend:${IMAGE_TAG}"
            export WORKER_IMAGE="ghcr.io/${IMAGE_NAMESPACE}/worker:${IMAGE_TAG}"
            export MIGRATOR_IMAGE="ghcr.io/${IMAGE_NAMESPACE}/migrator:${IMAGE_TAG}"
            export FRONTEND_IMAGE="ghcr.io/${IMAGE_NAMESPACE}/frontend:${IMAGE_TAG}"

            echo "Deploying images:"
            echo "  Backend: $BACKEND_IMAGE"
            echo "  Worker: $WORKER_IMAGE"
            echo "  Migrator: $MIGRATOR_IMAGE"
            echo "  Frontend: $FRONTEND_IMAGE"

            # Use docker-compose (with hyphen) for older Docker versions
            compose() {
              if command -v docker-compose >/dev/null 2>&1; then
                docker-compose "$@"
              else
                docker compose "$@"
              fi
            }

            # Create docker-compose.yml for stateless deployment
            cat > docker-compose.yml << 'EOF'
            version: '3.8'

            services:
              postgres:
                image: postgres:15-alpine
                environment:
                  POSTGRES_DB: ${POSTGRES_DB}
                  POSTGRES_USER: ${POSTGRES_USER}
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                ports:
                  - "5432:5432"
                restart: unless-stopped
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              migrator:
                image: ${MIGRATOR_IMAGE}
                environment:
                  DATABASE_URL: ${DATABASE_URL}
                depends_on:
                  postgres:
                    condition: service_healthy
                profiles:
                  - tools

              backend:
                image: ${BACKEND_IMAGE}
                ports:
                  - "4000:4000"
                environment:
                  NODE_ENV: ${NODE_ENV}
                  HOST: ${HOST}
                  PORT: ${PORT}
                  DATABASE_URL: ${DATABASE_URL}
                  AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
                  AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS}
                  SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
                  SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
                  LLM_PROVIDER_PRIORITY: ${LLM_PROVIDER_PRIORITY}
                  AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
                  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
                  AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
                  AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION}
                  GEMINI_API_KEY: ${GEMINI_API_KEY}
                  GEMINI_MODEL: ${GEMINI_MODEL}
                  LENCO_API_KEY: ${LENCO_API_KEY}
                  LENCO_API_BASE_URL: ${LENCO_API_BASE_URL}
                  CORS_ORIGIN: ${CORS_ORIGIN}
                  FRONTEND_URL: ${FRONTEND_URL}
                  EXPORT_STORAGE_DIR: ${EXPORT_STORAGE_DIR}
                  INGESTION_EMBEDDINGS_ENABLED: ${INGESTION_EMBEDDINGS_ENABLED}
                  EMBEDDING_PROVIDER_PRIORITY: ${EMBEDDING_PROVIDER_PRIORITY}
                  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
                  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
                  GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI}
                  EMAIL_ENABLED: ${EMAIL_ENABLED}
                  EMAIL_FROM: ${EMAIL_FROM}
                  SUPPORT_EMAIL: ${SUPPORT_EMAIL}
                  WHATSAPP_GROUP_LINK: ${WHATSAPP_GROUP_LINK}
                  PRESENTATION_ENABLE_AI_IMAGES: ${PRESENTATION_ENABLE_AI_IMAGES}
                  AZURE_DALLE_ENDPOINT: ${AZURE_DALLE_ENDPOINT}
                  AZURE_DALLE_API_KEY: ${AZURE_DALLE_API_KEY}
                volumes:
                  - backend_storage:/app/storage
                depends_on:
                  postgres:
                    condition: service_healthy
                restart: unless-stopped
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 3

              worker:
                image: ${WORKER_IMAGE}
                environment:
                  NODE_ENV: ${NODE_ENV}
                  DATABASE_URL: ${DATABASE_URL}
                  EXPORT_STORAGE_DIR: ${EXPORT_STORAGE_DIR}
                  EXPORT_WORKER_POLL_MS: ${EXPORT_WORKER_POLL_MS}
                  LLM_PROVIDER_PRIORITY: ${LLM_PROVIDER_PRIORITY}
                  AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
                  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
                  AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
                  AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION}
                  GEMINI_API_KEY: ${GEMINI_API_KEY}
                  GEMINI_MODEL: ${GEMINI_MODEL}
                  INGESTION_EMBEDDINGS_ENABLED: ${INGESTION_EMBEDDINGS_ENABLED}
                  EMBEDDING_PROVIDER_PRIORITY: ${EMBEDDING_PROVIDER_PRIORITY}
                  PRESENTATION_ENABLE_AI_IMAGES: ${PRESENTATION_ENABLE_AI_IMAGES}
                  AZURE_DALLE_ENDPOINT: ${AZURE_DALLE_ENDPOINT}
                  AZURE_DALLE_API_KEY: ${AZURE_DALLE_API_KEY}
                volumes:
                  - backend_storage:/app/storage
                depends_on:
                  postgres:
                    condition: service_healthy
                restart: unless-stopped

              frontend:
                image: ${FRONTEND_IMAGE}
                ports:
                  - "${APP_PORT}:80"
                restart: unless-stopped
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:80"]
                  interval: 30s
                  timeout: 10s
                  retries: 3

            volumes:
              postgres_data:
              backend_storage:
            EOF

            # Create .env file from environment variables
            cat > .env << EOF
            # Database
            POSTGRES_DB=${POSTGRES_DB:-edunurse}
            POSTGRES_USER=${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-edunurse}
            DATABASE_URL=${DATABASE_URL:-postgresql://postgres:edunurse@postgres:5432/edunurse?schema=public}

            # Application
            NODE_ENV=${NODE_ENV:-production}
            HOST=${HOST:-0.0.0.0}
            PORT=${PORT:-4000}
            APP_PORT=${APP_PORT:-80}

            # Images
            BACKEND_IMAGE=$BACKEND_IMAGE
            WORKER_IMAGE=$WORKER_IMAGE
            MIGRATOR_IMAGE=$MIGRATOR_IMAGE
            FRONTEND_IMAGE=$FRONTEND_IMAGE

            # Auth
            AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET}
            AUTH_TOKEN_TTL_SECONDS=${AUTH_TOKEN_TTL_SECONDS:-86400}
            SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL}
            SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}

            # LLM
            LLM_PROVIDER_PRIORITY=${LLM_PROVIDER_PRIORITY:-azure,gemini}
            AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
            AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
            AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT}
            AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION}
            GEMINI_API_KEY=${GEMINI_API_KEY}
            GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}

            # Payment
            LENCO_API_KEY=${LENCO_API_KEY}
            LENCO_API_BASE_URL=${LENCO_API_BASE_URL}

            # CORS
            CORS_ORIGIN=${CORS_ORIGIN}
            FRONTEND_URL=${FRONTEND_URL}

            # Storage
            EXPORT_STORAGE_DIR=${EXPORT_STORAGE_DIR:-/app/storage/exports}
            EXPORT_WORKER_POLL_MS=${EXPORT_WORKER_POLL_MS:-2000}

            # Embeddings
            INGESTION_EMBEDDINGS_ENABLED=${INGESTION_EMBEDDINGS_ENABLED:-true}
            EMBEDDING_PROVIDER_PRIORITY=${EMBEDDING_PROVIDER_PRIORITY:-azure,gemini}

            # OAuth
            GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
            GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
            GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI}

            # Email
            EMAIL_ENABLED=${EMAIL_ENABLED:-true}
            EMAIL_FROM=${EMAIL_FROM}
            SUPPORT_EMAIL=${SUPPORT_EMAIL}
            WHATSAPP_GROUP_LINK=${WHATSAPP_GROUP_LINK}

            # AI Images
            PRESENTATION_ENABLE_AI_IMAGES=${PRESENTATION_ENABLE_AI_IMAGES:-true}
            AZURE_DALLE_ENDPOINT=${AZURE_DALLE_ENDPOINT}
            AZURE_DALLE_API_KEY=${AZURE_DALLE_API_KEY}
            EOF

            # Pull latest images
            echo "Pulling latest images..."
            compose pull

            # Start postgres first
            compose up -d postgres
            echo "Waiting for postgres to be ready..."
            sleep 30

            # Run migrations
            echo "Running database migrations..."
            compose --profile tools run --rm migrator

            # Start all services
            echo "Starting all services..."
            compose up -d backend worker frontend

            # Show status
            compose ps
            compose logs --tail=50 backend worker || true
