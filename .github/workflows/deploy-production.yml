name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: false
        default: "main"

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_namespace: ${{ steps.meta.outputs.image_namespace }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Resolve build ref
        id: build_ref
        run: |
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            echo "value=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.build_ref.outputs.value }}

      - name: Prepare image metadata
        id: meta
        run: |
          IMAGE_NAMESPACE="$(echo "${GITHUB_REPOSITORY_OWNER}/edunurse" | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="sha-${GITHUB_SHA::12}"
          echo "image_namespace=$IMAGE_NAMESPACE" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend runner image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/backend:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/backend:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/backend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/backend:buildcache,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/worker:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/worker:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/worker:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/worker:buildcache,mode=max

      - name: Build and push migrator image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: migrator
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/migrator:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/migrator:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/migrator:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/migrator:buildcache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api/v1' }}
            VITE_GOOGLE_OAUTH_CLIENT_ID=${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID || '' }}
            VITE_GOOGLE_OAUTH_REDIRECT_URI=${{ vars.VITE_GOOGLE_OAUTH_REDIRECT_URI || '' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/frontend:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/frontend:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/frontend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_namespace }}/frontend:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Resolve deploy ref
        id: ref
        run: |
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            echo "value=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_REF: ${{ steps.ref.outputs.value }}
          IMAGE_NAMESPACE: ${{ needs.build-and-push.outputs.image_namespace }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SERVER_ENV_FILE: ${{ secrets.SERVER_ENV_FILE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: DEPLOY_PATH,DEPLOY_REF,IMAGE_NAMESPACE,IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN,SERVER_ENV_FILE
          script_stop: true
          script: |
            set -euo pipefail

            DEPLOY_PATH="${DEPLOY_PATH:-/var/www/livingilabs/edunurse}"
            DEPLOY_REF="${DEPLOY_REF:-main}"

            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "Deploy path not found: $DEPLOY_PATH"
              exit 1
            fi

            cd "$DEPLOY_PATH"

            if [ ! -f "deploy/docker-compose.server.yml" ]; then
              echo "Missing deploy/docker-compose.server.yml in $DEPLOY_PATH"
              exit 1
            fi
            echo "Deploying ref: $DEPLOY_REF"
            git fetch --all --prune
            git checkout "$DEPLOY_REF" || git checkout -B "$DEPLOY_REF" "origin/$DEPLOY_REF"
            git pull --ff-only origin "$DEPLOY_REF" || true

            if [ -z "${SERVER_ENV_FILE:-}" ]; then
              echo "Missing SERVER_ENV_FILE secret in GitHub environment."
              exit 1
            fi
            printf "%s" "$SERVER_ENV_FILE" > deploy/.env.server
            chmod 600 deploy/.env.server

            export BACKEND_IMAGE="ghcr.io/${IMAGE_NAMESPACE}/backend:${IMAGE_TAG}"
            export WORKER_IMAGE="ghcr.io/${IMAGE_NAMESPACE}/worker:${IMAGE_TAG}"
            export MIGRATOR_IMAGE="ghcr.io/${IMAGE_NAMESPACE}/migrator:${IMAGE_TAG}"
            export FRONTEND_IMAGE="ghcr.io/${IMAGE_NAMESPACE}/frontend:${IMAGE_TAG}"

            compose() {
              if command -v docker-compose >/dev/null 2>&1; then
                docker-compose "$@"
              else
                docker compose "$@"
              fi
            }

            if [ -n "${GHCR_USERNAME:-}" ] && [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            else
              echo "GHCR credentials not provided. Skipping docker login."
            fi

            compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server up -d postgres
            compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server pull backend worker frontend migrator
            compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server --profile tools run --rm migrator
            compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server up -d backend worker frontend

            compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server ps
            compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server logs --tail=120 backend worker || true
