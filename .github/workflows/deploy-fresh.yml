name: Deploy with Fresh Database

# This workflow DELETES all data and starts fresh
# Only run this manually when you want to reset everything

on:
  workflow_dispatch:
    inputs:
      confirm_delete:
        description: 'Type "DELETE ALL DATA" to confirm'
        required: true
        type: string

jobs:
  deploy-fresh:
    runs-on: ubuntu-latest
    
    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_delete }}" != "DELETE ALL DATA" ]; then
            echo "Confirmation text does not match. Aborting."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build backend
        working-directory: ./backend
        run: |
          npm ci
          npm run build
        env:
          NODE_ENV: production

      - name: Install and build frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: /api/v1

      - name: Deploy with fresh database
        if: success()
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/livingilabs/edunurse
            
            echo "Pulling latest code..."
            git pull origin main
            
            echo "Stopping all services..."
            docker-compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server down
            
            echo "DELETING ALL DATA..."
            docker volume rm deploy_postgres_data || true
            docker volume rm deploy_export_data || true
            
            echo "Rebuilding images..."
            docker-compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server build
            
            echo "Starting fresh database..."
            docker-compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server up -d postgres
            
            echo "Waiting for database to initialize..."
            sleep 60
            
            echo "Running migrations..."
            docker-compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server --profile tools run --rm migrator
            
            echo "Starting all services..."
            docker-compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server up -d
            
            echo "Deployment complete!"
            docker-compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server ps

      - name: Verify deployment
        if: success()
        run: |
          sleep 15
          curl -f https://edunurse.bwangubwangu.net/api/v1/health || exit 1
          echo "Deployment verified successfully!"
