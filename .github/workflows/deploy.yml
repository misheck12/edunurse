name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build backend
        working-directory: ./backend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1

      - name: Deploy to server
        if: success()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /var/www/livingilabs/edunurse
            
            # Pull latest code
            git pull origin main
            
            # Stop services
            docker-compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server down
            
            # Remove old data (only if build succeeded)
            docker volume rm deploy_postgres_data || true
            docker volume rm deploy_export_data || true
            
            # Rebuild images
            docker-compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server build
            
            # Start database
            docker-compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server up -d postgres
            
            # Wait for database
            sleep 30
            
            # Run migrations
            docker-compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server --profile tools run --rm migrator
            
            # Start all services
            docker-compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server up -d
            
            # Check status
            docker-compose -f deploy/docker-compose.server.yml --env-file deploy/.env.server ps

      - name: Verify deployment
        if: success()
        run: |
          sleep 10
          curl -f https://edunurse.bwangubwangu.net/api/v1/health || exit 1
